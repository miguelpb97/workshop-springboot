server:
  port: 8080

spring:
  application:
    name: taller-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taller_db}
    username: ${DB_USER:taller_user}
    password: ${DB_PASSWORD:taller_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-en-produccion-por-una-mucho-mas-larga-y-secreta-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  level:
    com.miguel.tallerapi: DEBUG
    org.springframework.security: INFO
